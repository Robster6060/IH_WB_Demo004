; 2026-09-12: this project has no hand-placed NavMeshBoundsVolume (procedural, seed-varying realm
; up to ~105x65 km - a single fixed volume can't cover it, and a full-realm bake would be
; prohibitively expensive). Dynamic + invoker-based generation (see
; UNavigationSystemV1::RegisterNavigationInvoker, called from AIH_P1C08_MannequinActor's
; Begin/EndPlay) builds NavMesh tiles only near actual units, scaling to the whole realm without
; needing any placed bounds volume. Once Terrain Stamps' terrain is finalized ("baked"), reassess
; whether a pre-built static NavMesh is worth switching to for shipping performance.
;
; IMPORTANT: RuntimeGeneration is a property of ANavigationData/ARecastNavMesh (UCLASS(config=Engine,
; defaultconfig) on ANavigationData), NOT of UNavigationSystemV1 - confirmed by reading the engine
; source after an earlier attempt silently no-op'd by putting it under the wrong section below. It
; must live under [/Script/NavigationSystem.RecastNavMesh], not [/Script/NavigationSystem.NavigationSystemV1].
[/Script/NavigationSystem.NavigationSystemV1]
bGenerateNavigationOnlyAroundNavigationInvokers=True

[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic

[/Script/Engine.RendererSettings]
bGenerateMeshDistanceFields=True

[ConsoleVariables]
ih.Dev.ShowTemplateGallery=0
; r.Water.WaterMesh.MaxWidthInTiles not set â€” P1C12 uses custom ocean plane (AIH_P1C12_OceanPlane), not AWaterBodyOcean
r.GenerateMeshDistanceFields=1

; 2026-09-19 (First Bake): default 250,000 silently DROPS complex collision on any baked
; UDynamicMeshComponent above that triangle count with only a log warning, no error - confirmed in
; PIE, island 0 baked at 259,548 tris and got ZERO usable collision as a result (LogGeometry:
; "Ignoring attempt to build Complex Collision..."). This project's real island terrain routinely
; exceeds 250K triangles (Fougeres alone: 287,334 per an earlier PGC investigation this session) -
; raised well above any realistic single-island triangle count instead of trying to keep terrain
; under an arbitrary engine default.
geometry.DynamicMesh.MaxComplexCollisionTriCount=2000000

; NOTE (P1C12 Gate 0): Water plugin is ENABLED for future buoyancy use but AWaterBodyOcean/AWaterZone
